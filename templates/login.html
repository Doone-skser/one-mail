{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}
{% block container_class %}max-w-md{% endblock %}
{% block content %}
<div class="card bg-base-100 shadow-sm mt-12">
  <div class="card-body">
    <h1 class="card-title text-xl">管理员登录</h1>
    {% if error %}
    <div role="alert" class="alert alert-warning alert-soft text-sm">{{ error }}</div>
    {% endif %}
    <form method="post" class="mt-2">
      <fieldset class="fieldset">
        <legend class="fieldset-legend">管理员邮箱</legend>
        <input type="email" name="email" required autofocus placeholder="admin@example.com"
               class="input w-full">
      </fieldset>
      <fieldset class="fieldset">
        <legend class="fieldset-legend">密码</legend>
        <input type="password" name="password" required class="input w-full">
      </fieldset>
      <button class="btn btn-primary w-full mt-4" type="submit">登录</button>
    </form>
    <p class="text-sm text-base-content/60 mt-3">
      使用邮件服务器管理员账号登录,会话有效期 12 小时。
    </p>
  </div>
</div>
{% endblock %}
