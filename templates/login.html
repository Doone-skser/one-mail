{% extends "base.html" %}
{% block title %}管理员登录{% endblock %}
{% block container_class %}max-w-sm{% endblock %}
{% block content %}
<section class="card card--default mt-10 p-6">
  <div class="card__content gap-5">
    <div class="flex flex-col items-center gap-2 text-center">
      <img class="size-12" src="{{ url_for('static', filename='logo.png') }}" alt="">
      <h1 class="text-xl font-semibold">管理员登录</h1>
      <p class="text-sm text-muted">使用邮件服务器管理员账号登录</p>
    </div>
    {% if error %}
    <div class="alert alert--warning" role="alert">
      <div class="alert__content"><div class="alert__description">{{ error }}</div></div>
    </div>
    {% endif %}
    <form method="post" class="flex flex-col gap-4">
      <label>
        <span class="field-label">管理员邮箱</span>
        <input type="email" name="email" required autofocus placeholder="admin@example.com"
               autocomplete="username" class="input input--full-width">
      </label>
      <label>
        <span class="field-label">密码</span>
        <input type="password" name="password" required autocomplete="current-password"
               class="input input--full-width">
      </label>
      <button class="button button--primary button--full-width mt-1" type="submit">登录</button>
    </form>
    <p class="text-center text-xs text-muted">会话有效期 12 小时</p>
  </div>
</section>
{% endblock %}
