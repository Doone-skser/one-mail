<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OneMail{% endblock %}</title>
<style>
  /* ---------- 设计令牌 ---------- */
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #111827;
    --text-2: #6b7280;
    --border: #e6e7eb;
    --accent: #4f46e5;
    --accent-hover: #4338ca;
    --accent-soft: #eef2ff;
    --accent-border: #c7d2fe;
    --on-accent: #ffffff;
    --success: #15803d;
    --success-bg: #dcfce7;
    --warning: #c2410c;
    --warning-bg: #ffedd5;
    --danger: #dc2626;
    --danger-hover: #b91c1c;
    --gray-soft: #f3f4f6;
    --gray-soft-hover: #e9eaee;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 3px rgba(16, 24, 40, .06);
    --shadow-hover: 0 6px 16px rgba(16, 24, 40, .10);
    --font-ui: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font-ui); background: var(--bg); color: var(--text);
         line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  .container-wide { max-width: 960px; }
  .container-msg { max-width: 1000px; width: 94%; }

  /* 焦点环:全站交互元素统一 */
  a:focus-visible, button:focus-visible, select:focus-visible,
  input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px;
                        border-radius: var(--radius-sm); }

  /* ---------- 顶栏 ---------- */
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 0; }
  .topbar .container { display: flex; align-items: center; justify-content: space-between;
                       padding-top: 0; padding-bottom: 0; }
  .brand { font-size: 16px; font-weight: 700; color: var(--text); text-decoration: none;
           letter-spacing: .01em; }
  .brand span { color: var(--accent); }
  .nav a { color: var(--text-2); text-decoration: none; margin-left: 18px; font-size: 14px;
           transition: color .15s; }
  .nav a:hover { color: var(--accent); }

  /* ---------- 卡片与文字 ---------- */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
          box-shadow: var(--shadow); padding: 20px; margin-top: 18px; }
  h1 { font-size: 20px; margin-bottom: 12px; font-weight: 650; }
  h2 { font-size: 16px; margin-bottom: 10px; font-weight: 650; }
  .muted { color: var(--text-2); font-size: 13px; }
  a { color: var(--accent); text-decoration: none; transition: color .15s; }
  a:hover { color: var(--accent-hover); }

  /* ---------- 按钮 ---------- */
  .btn { display: inline-block; background: var(--accent); color: var(--on-accent); border: none;
         border-radius: var(--radius-sm); padding: 7px 14px; font-size: 14px;
         cursor: pointer; white-space: nowrap; font-family: var(--font-ui);
         transition: background-color .15s, transform .1s; }
  .btn:hover { background: var(--accent-hover); }
  .btn:active { transform: translateY(1px); }
  .btn-sm { padding: 4px 12px; font-size: 13px; }
  .btn-soft { background: var(--accent-soft); color: var(--accent);
              border: 1px solid var(--accent-border); }
  .btn-soft:hover { background: var(--accent-border); color: var(--accent-hover); }
  .btn-gray { background: var(--gray-soft); color: var(--text); }
  .btn-gray:hover { background: var(--gray-soft-hover); }
  .btn-red { background: var(--danger); }
  .btn-red:hover { background: var(--danger-hover); }
  .btn:disabled { background: var(--gray-soft); color: var(--text-2); cursor: not-allowed; }
  .copy-btn.copied { background: var(--success); border-color: var(--success); color: var(--on-accent);
                     transition: background-color .2s; }

  /* ---------- 表单 ---------- */
  input[type=text], input[type=password], input[type=email], select {
    padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    font-size: 14px; background: var(--card); color: var(--text); font-family: var(--font-ui); }
  input[type=text], input[type=password], input[type=email] { width: 100%; margin-bottom: 12px; }
  select { cursor: pointer; }
  label { font-size: 13px; color: var(--text-2); display: block; margin-bottom: 4px; }
  .form-inline { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .form-inline select { padding: 4px 8px; font-size: 13px; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

  /* ---------- 提示条 / 徽章 ---------- */
  .alert { background: var(--warning-bg); border: 1px solid var(--warning-bg);
           color: var(--warning); border-radius: var(--radius-sm);
           padding: 10px 14px; margin-bottom: 14px; font-size: 14px; }
  .ok { background: var(--success-bg); border: 1px solid var(--success-bg);
        color: var(--success); border-radius: var(--radius-sm);
        padding: 10px 14px; margin-bottom: 12px; font-size: 14px; word-break: break-all; }
  .badge { display: inline-block; border-radius: 999px; padding: 2px 10px;
           font-size: 12px; white-space: nowrap; }
  .badge-on { background: var(--success-bg); color: var(--success); }
  .badge-off { background: var(--gray-soft); color: var(--text-2); }
  .badge-expired { background: var(--warning-bg); color: var(--warning); }

  /* ---------- 表格(管理端) ---------- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--border);
           vertical-align: middle; word-break: break-all; }
  th { color: var(--text-2); font-weight: 500; font-size: 13px; white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  .header-meta td { border-bottom: none; padding: 3px 8px 3px 0; }
  .header-meta td:first-child { color: var(--text-2); white-space: nowrap; width: 60px; }

  .pager { margin-top: 18px; display: flex; gap: 10px; justify-content: center; align-items: center; }

  /* ---------- 取件页:页头与标签栏 ---------- */
  .inbox-head { padding: 24px 20px; }
  .inbox-email-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .inbox-email { font-family: var(--font-mono); font-size: 19px; font-weight: 600;
                 letter-spacing: .01em; word-break: break-all; }
  .tabs { display: flex; gap: 6px; margin-top: 14px; }
  .tab { padding: 6px 16px; border-radius: 999px; font-size: 14px; color: var(--text-2);
         text-decoration: none; white-space: nowrap;
         transition: background-color .15s, color .15s; }
  .tab:hover { background: var(--gray-soft); color: var(--text); }
  .tab.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .inbox-sub { color: var(--text-2); font-size: 13px; margin-top: 10px;
               display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .live { display: inline-flex; align-items: center; gap: 6px; }
  .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success);
              flex: none; }
  @keyframes live-pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: .45; transform: scale(.75); }
  }
  @media (prefers-reduced-motion: no-preference) {
    .live-dot { animation: live-pulse 2.4s ease-in-out infinite; }
  }

  /* ---------- 取件页:邮件卡片 ---------- */
  .mail-list { margin-top: 16px; display: flex; flex-direction: column; gap: 12px; }
  .mail-card { background: var(--card); border: 1px solid var(--border);
               border-radius: var(--radius); box-shadow: var(--shadow);
               padding: 16px 20px; position: relative;
               transition: transform .15s, box-shadow .15s; }
  @media (prefers-reduced-motion: no-preference) {
    .mail-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-hover); }
  }
  @media (prefers-reduced-motion: reduce) {
    .mail-card:hover { box-shadow: var(--shadow-hover); }
  }
  .mail-card.latest { border-left: 3px solid var(--accent); }
  .tag-latest { position: absolute; top: 12px; right: 16px; font-size: 11px;
                color: var(--accent); background: var(--accent-soft);
                border-radius: 999px; padding: 1px 8px; }
  .mail-code-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .code-big { font-family: var(--font-mono); font-size: 30px; font-weight: 700;
              letter-spacing: .12em; color: var(--text); line-height: 1.2;
              font-variant-numeric: tabular-nums; }
  .mail-meta { margin-top: 8px; font-size: 13px; color: var(--text-2);
               display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
  .mail-meta a { color: var(--text); font-weight: 500; }
  .mail-meta a:hover { color: var(--accent); }
  .mail-meta time { font-variant-numeric: tabular-nums; margin-left: auto; }
  .mail-subject { color: var(--text-2); }
  .mail-plain-subject a { font-size: 15px; font-weight: 550; color: var(--text); }
  .mail-plain-subject a:hover { color: var(--accent); }
  .mail-from { color: var(--text-2); }

  /* ---------- 详情页 ---------- */
  .code-hero { text-align: center; padding: 32px 20px; }
  .code-hero .code-big { font-size: 44px; letter-spacing: .14em; display: block; }
  .code-hero .copy-btn { margin-top: 14px; }
  .code-hero .muted { margin-bottom: 4px; }
  .meta-dl { display: grid; grid-template-columns: 64px 1fr; row-gap: 4px;
             font-size: 14px; }
  .meta-dl dt { color: var(--text-2); }
  .meta-dl dd { word-break: break-all; }
  .mail-body { background: var(--card); border: 1px solid var(--border);
               border-radius: var(--radius); box-shadow: var(--shadow);
               padding: 24px; margin-top: 16px; }
  .mail-body-content { width: 100%; margin: 0 auto; line-height: 1.7; }
  .mail-body pre { white-space: pre-wrap; word-break: break-word;
                   font-family: var(--font-ui); font-size: 16px; }
  iframe.htmlmail { width: 100%; min-height: 70vh; border: none; display: block; }
  /* 远端资源开关条 */
  .remote-bar { margin-top: 16px; padding: 8px 14px; background: var(--card);
                border: 1px solid var(--border); border-radius: var(--radius-sm);
                font-size: 13px; color: var(--text-2);
                display: flex; justify-content: space-between; align-items: center;
                gap: 10px; flex-wrap: wrap; }

  /* ---------- 失效页 ---------- */
  .empty-state { text-align: center; padding: 56px 24px; margin-top: 48px; }
  .empty-state svg { color: var(--text-2); opacity: .6; }
  .empty-state h1 { margin-top: 16px; font-size: 19px; }
  .empty-state p { margin-top: 8px; }

  /* ---------- 管理端行内 ---------- */
  .toolbar { display: flex; gap: 10px; margin-top: 18px; align-items: center; }
  .toolbar input[type=text] { flex: 1; min-width: 0; margin-bottom: 0; }
  @media (max-width: 640px) {
    .toolbar { flex-wrap: wrap; }
    .toolbar input[type=text] { flex: 1 1 100%; }
  }
  .box-head { display: flex; justify-content: space-between; align-items: center;
              gap: 10px; flex-wrap: wrap; }
  .box-email { font-size: 16px; font-weight: 600; font-family: var(--font-mono); }
  .link-sub { margin-top: 12px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .link-row { display: flex; justify-content: space-between; align-items: center;
              gap: 10px; flex-wrap: wrap; padding: 10px 0;
              border-bottom: 1px solid var(--border); }
  .link-row:last-child { border-bottom: none; }
  .link-info { min-width: 220px; flex: 1; }
  .link-meta { color: var(--text-2); font-size: 12px; margin-top: 2px; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 640px) {
    .hide-sm { display: none; }
    th, td { padding: 8px 5px; font-size: 13px; }
    .container { padding: 16px 10px 40px; }
    .card { padding: 16px; }
    .code-big { font-size: 26px; }
    .code-hero .code-big { font-size: 34px; }
    .mail-card { padding: 14px 16px; }
    .mail-meta time { margin-left: 0; width: 100%; }
    .link-row { flex-direction: column; align-items: flex-start; }
    .actions { width: 100%; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="container">
    <a class="brand" href="/">One<span>Mail</span> 取件</a>
    <div class="nav">{% block nav %}{% endblock %}</div>
  </div>
</div>
<div class="container{% block container_class %}{% endblock %}">
  {% block content %}{% endblock %}
</div>
<script>
function copyText(t, btn) {
  function feedback() {
    if (!btn) { alert('已复制'); return; }
    btn.classList.add('copied');
    var old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(function () {
      btn.classList.remove('copied');
      btn.textContent = old;
    }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(feedback, function () { fallbackCopy(t); feedback(); });
  } else {
    fallbackCopy(t); feedback();
  }
}
function fallbackCopy(t) {
  var i = document.createElement('textarea');
  i.value = t; i.style.position = 'fixed'; i.style.opacity = '0';
  document.body.appendChild(i); i.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(i);
}
// 验证码复制按钮:带"已复制"反馈
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.copy-btn');
  if (!btn) return;
  copyText(btn.getAttribute('data-code'), btn);
});
</script>
</body>
</html>
