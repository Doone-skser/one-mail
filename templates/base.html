<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}OneMail{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="bg-base-200 min-h-screen">
<div class="navbar bg-base-100 border-b border-base-300 min-h-0 py-2">
  <div class="mx-auto w-full max-w-5xl px-4 flex items-center justify-between">
    <a class="font-bold tracking-tight" href="/">One<span class="text-primary">Mail</span> 取件</a>
    <div class="flex items-center gap-1 text-sm">{% block nav %}{% endblock %}</div>
  </div>
</div>
<div class="mx-auto w-full {% block container_class %}max-w-3xl{% endblock %} px-4 pt-6 pb-12">
  {% block content %}{% endblock %}
</div>
<script>
function copyText(t, btn) {
  function feedback() {
    if (!btn) { alert('已复制'); return; }
    btn.classList.add('btn-success');
    var old = btn.textContent;
    btn.textContent = '已复制 ✓';
    setTimeout(function () {
      btn.classList.remove('btn-success');
      btn.textContent = old;
    }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(feedback, function () { fallbackCopy(t); feedback(); });
  } else {
    fallbackCopy(t); feedback();
  }
}
function fallbackCopy(t) {
  var i = document.createElement('textarea');
  i.value = t; i.style.position = 'fixed'; i.style.opacity = '0';
  document.body.appendChild(i); i.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(i);
}
// 验证码复制按钮:带"已复制"反馈
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.copy-btn');
  if (!btn) return;
  copyText(btn.getAttribute('data-code'), btn);
});
// toast:5s 自动消失,也可点 ✕ 立即关闭
document.querySelectorAll('.toast-item').forEach(function (t) {
  var timer = setTimeout(dismiss, 5000);
  function dismiss() {
    clearTimeout(timer);
    t.classList.add('opacity-0');
    setTimeout(function () { t.remove(); }, 350);
  }
  var x = t.querySelector('.toast-close');
  if (x) x.addEventListener('click', dismiss);
});
// 弹窗:点 ✕ / 关闭按钮 / 遮罩空白处关闭(daisyUI 用 modal-open 控制显隐)
document.addEventListener('click', function (e) {
  var x = e.target.closest('.modal-x');
  var mask = e.target.classList && e.target.classList.contains('modal') ? e.target : null;
  var m = x ? x.closest('.modal') : mask;
  if (m) m.classList.remove('modal-open');
});
</script>
</body>
</html>
