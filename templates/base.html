{# 管理端骨架(登录页 + admin_base.html):HeroUI 样式(static/app.css),与取件页同一套设计变量 #}
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}OneMail{% endblock %} · OneMail</title>
<script>
// HeroUI 深色主题靠 <html class="dark"> 切换:跟随系统,放在样式表之前避免闪白
(function () {
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function apply() { document.documentElement.classList.toggle('dark', mq.matches); }
  apply();
  if (mq.addEventListener) mq.addEventListener('change', apply);
})();
</script>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
</head>
<body class="min-h-screen">
{% block body %}
<header class="sticky top-0 z-10 border-b border-border bg-background/80 backdrop-blur-md">
  <div class="mx-auto flex h-14 w-full max-w-5xl items-center px-4">
    <a class="flex items-center gap-2 font-semibold tracking-tight" href="/">
      <img class="size-7" src="{{ url_for('static', filename='logo.png') }}" alt="">
      <span>One<span class="text-accent">Mail</span> 取件</span></a>
  </div>
</header>
<main class="mx-auto w-full {% block container_class %}max-w-3xl{% endblock %} px-4 pt-6 pb-12">
  {% block content %}{% endblock %}
</main>
<footer class="px-4 pb-6 text-center text-xs text-muted">
  <a class="link text-xs text-muted" href="https://github.com/Doone-skser/one-mail"
     target="_blank" rel="noopener noreferrer">GitHub · Doone-skser/one-mail</a>
</footer>
{% endblock %}
<script>
// 复制(.copy-btn 的 data-code,或 onclick="copyText(...)"):按钮上显示"已复制 ✓"
function copyText(t, btn) {
  function feedback() {
    if (!btn) { uiToast('已复制'); return; }
    if (btn.dataset.copying) return;
    btn.dataset.copying = '1';
    var old = btn.innerHTML;  // 存 innerHTML:按钮里可能带图标
    btn.textContent = '已复制 ✓';
    setTimeout(function () { btn.innerHTML = old; delete btn.dataset.copying; }, 1500);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(t).then(feedback, function () { fallbackCopy(t); feedback(); });
  } else {
    fallbackCopy(t); feedback();
  }
}
function fallbackCopy(t) {
  var i = document.createElement('textarea');
  i.value = t; i.style.position = 'fixed'; i.style.opacity = '0';
  document.body.appendChild(i); i.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(i);
}
document.addEventListener('click', function (e) {
  var btn = e.target.closest('.copy-btn');
  if (btn) copyText(btn.getAttribute('data-code'), btn);
});
// 提示条:5s 自动消失,也可点 ✕ 立即关闭(页面局部刷新后会再次调用)
function initToasts() {
  document.querySelectorAll('.toast-item:not([data-bound])').forEach(function (t) {
    t.setAttribute('data-bound', '1');
    var timer = setTimeout(dismiss, 5000);
    function dismiss() {
      clearTimeout(timer);
      t.style.opacity = '0';
      t.style.transform = 'translateY(-6px)';
      setTimeout(function () { t.remove(); }, 320);
    }
    var x = t.querySelector('.toast-close');
    if (x) x.addEventListener('click', dismiss);
  });
}
// 弹窗:服务端渲染时带 data-autoopen 的直接打开(如新链接/新邮箱结果)
function initDialogs() {
  document.querySelectorAll('dialog[data-autoopen]:not([open])').forEach(function (d) {
    d.removeAttribute('data-autoopen');
    if (d.showModal) d.showModal(); else d.setAttribute('open', '');
  });
}
// ---------- 统一弹窗:替代浏览器原生 alert / confirm / prompt ----------
// uiConfirm(消息, {title, ok, danger}) -> Promise<bool>
// uiPrompt(消息, 默认值, {title, ok, maxlength}) -> Promise<string|null>(取消为 null)
// uiAlert(消息, {title}) -> Promise
function uiDialog(o) {
  var d = document.getElementById('ui-dialog');
  if (!d) {
    d = document.createElement('dialog');
    d.id = 'ui-dialog';
    d.className = 'dlg';
    d.setAttribute('aria-labelledby', 'ui-dialog-title');
    d.innerHTML =
      '<h2 class="dlg__title" id="ui-dialog-title"></h2>' +
      '<p class="ui-msg mt-2 text-sm text-muted whitespace-pre-line wrap-anywhere"></p>' +
      '<input class="ui-input input input--full-width mt-4" autocomplete="off">' +
      '<div class="dlg__actions">' +
      '<button type="button" class="ui-cancel button button--tertiary">取消</button>' +
      '<button type="button" class="ui-ok button button--primary">确定</button></div>';
    document.body.appendChild(d);
    d.querySelector('.ui-cancel').addEventListener('click', function () { d.close('cancel'); });
    d.querySelector('.ui-ok').addEventListener('click', function () { d.close('ok'); });
    d.querySelector('.ui-input').addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); d.close('ok'); }
    });
  }
  var input = d.querySelector('.ui-input');
  var ok = d.querySelector('.ui-ok');
  var cancel = d.querySelector('.ui-cancel');
  d.querySelector('.dlg__title').textContent = o.title || '提示';
  d.querySelector('.ui-msg').textContent = o.message || '';
  d.querySelector('.ui-msg').hidden = !o.message;
  input.hidden = !o.prompt;
  input.value = o.value || '';
  if (o.maxlength) input.maxLength = o.maxlength; else input.removeAttribute('maxlength');
  input.placeholder = o.placeholder || '';
  ok.textContent = o.ok || '确定';
  ok.className = 'ui-ok button ' + (o.danger ? 'button--danger' : 'button--primary');
  cancel.hidden = !!o.alert;
  return new Promise(function (resolve) {
    function done() {
      d.removeEventListener('close', done);
      var yes = d.returnValue === 'ok';
      resolve(o.prompt ? (yes ? input.value : null) : yes);
    }
    d.returnValue = '';
    d.addEventListener('close', done);
    d.showModal();
    if (o.prompt) { input.focus(); input.select(); }
    else if (o.danger) cancel.focus();   // 危险操作默认焦点放"取消",回车不会误删
    else ok.focus();
  });
}
function uiConfirm(message, o) {
  o = o || {};
  return uiDialog({ title: o.title || '确认操作', message: message, ok: o.ok, danger: o.danger });
}
function uiPrompt(message, value, o) {
  o = o || {};
  return uiDialog({ title: o.title || message, message: o.title ? message : '', prompt: true,
                    value: value, ok: o.ok, maxlength: o.maxlength, placeholder: o.placeholder });
}
function uiAlert(message, o) {
  o = o || {};
  return uiDialog({ title: o.title || '提示', message: message, alert: true, ok: o.ok || '知道了' });
}
function uiToast(text) {
  var stack = document.querySelector('.toast-stack');
  if (!stack) {
    stack = document.createElement('div');
    stack.className = 'toast-stack';
    document.body.appendChild(stack);
  }
  var t = document.createElement('div');
  t.className = 'toast-item';
  t.setAttribute('role', 'status');
  t.innerHTML = '<span class="flex-1 break-all"></span>' +
    '<button class="toast-close button button--sm button--ghost button--icon-only" type="button" aria-label="关闭">✕</button>';
  t.firstChild.textContent = text;
  stack.appendChild(t);
  initToasts();
}
// 表单二次确认:<form data-confirm="..."> 或提交按钮上的 data-confirm(可加 data-danger)。
// 捕获阶段拦截,先于页面里的 fetch 提交逻辑;确认后带原提交按钮重新提交。
document.addEventListener('submit', function (e) {
  var form = e.target;
  var btn = e.submitter;
  var src = btn && btn.hasAttribute('data-confirm') ? btn :
            form.hasAttribute('data-confirm') ? form : null;
  if (!src) return;
  if (form.dataset.confirmed) { delete form.dataset.confirmed; return; }
  e.preventDefault();
  e.stopImmediatePropagation();
  uiConfirm(src.getAttribute('data-confirm'), {
    title: src.getAttribute('data-title') || '确认操作',
    ok: src.getAttribute('data-ok') || '确定',
    danger: src.hasAttribute('data-danger')
  }).then(function (yes) {
    if (!yes) return;
    form.dataset.confirmed = '1';
    if (form.requestSubmit) form.requestSubmit(btn || undefined); else form.submit();
  });
}, true);

initToasts();
initDialogs();
document.addEventListener('click', function (e) {
  // 弹窗:点 ✕ / 关闭按钮 / 遮罩空白处关闭
  var x = e.target.closest('.dlg-x');
  if (x) { x.closest('dialog').close(); return; }
  if (e.target.tagName === 'DIALOG' && e.target.classList.contains('dlg')) {
    var r = e.target.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) e.target.close();
  }
  // 下拉菜单:点外面收起
  document.querySelectorAll('details.dd[open]').forEach(function (d) {
    if (!d.contains(e.target)) d.removeAttribute('open');
  });
});
</script>
</body>
</html>
