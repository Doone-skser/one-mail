{# 操作结果提示(管理端各页共用);自动消失逻辑在 base.html #}
{% from "_icons.html" import icon %}
{% if flash_msg or flash_err %}
<div class="toast-stack">
  {% if flash_msg %}
  <div role="status" class="toast-item">
    <span class="text-success">{{ icon('check') }}</span>
    <span class="flex-1 break-all">{{ flash_msg }}</span>
    <button class="toast-close button button--sm button--ghost button--icon-only" type="button" aria-label="关闭">✕</button>
  </div>
  {% endif %}
  {% if flash_err %}
  <div role="alert" class="toast-item">
    <span class="text-warning">{{ icon('ban') }}</span>
    <span class="flex-1 break-all">{{ flash_err }}</span>
    <button class="toast-close button button--sm button--ghost button--icon-only" type="button" aria-label="关闭">✕</button>
  </div>
  {% endif %}
</div>
{% endif %}
