# 先部署此 HTTP 配置,然后运行:
#   certbot --nginx -d one-mail.example.com --non-interactive --agree-tos -m <管理员邮箱> --redirect
# certbot 会自动在本文件追加 443 SSL server 和 80→443 跳转。
server {
    listen 80;
    listen [::]:80;
    server_name one-mail.example.com;

    location / {
        proxy_pass http://127.0.0.1:8200;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
