# OneMail 安全日志匹配:/opt/onemail/security.log
# 行格式: 2026-08-26T01:23:45 LOGIN_FAIL ip=1.2.3.4 email=a@b.c
# 注意:fail2ban 匹配前会把时间戳从行内剥掉,正则不要锚定行首时间戳
[Definition]
failregex = LOGIN_FAIL ip=<ADDR>
            LOGIN_LOCKED ip=<ADDR>
            TOKEN404 ip=<ADDR>
            TOKEN429 ip=<ADDR>
ignoreregex =
